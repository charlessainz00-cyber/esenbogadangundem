<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Gündem Panosu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><a class="brand" href="#"><span class="mark">g.</span><span>gündem<small>haber panosu</small></span></a><div class="top-right"><span id="connection" class="status">● Bağlanıyor</span><button id="adminToggle" class="button ghost">Yönetici girişi</button></div></header>
  <main class="layout">
    <section class="filters" id="filters" aria-label="Haber kategorileri"></section>
    <section id="adminPanel" class="admin hidden">
      <div class="panel-head"><div><div class="eyebrow">YÖNETİM</div><h2 id="formHeading">Yeni haber ekle</h2></div><button id="logout" class="button ghost hidden">Çıkış</button></div>
      <form id="loginForm" class="login-row"><label class="field grow"><span>Yönetici anahtarı</span><input id="adminKey" type="password" autocomplete="current-password" placeholder="Netlify yönetici anahtarı" required></label><button class="button light" type="submit">Giriş yap</button></form>
      <div id="editor" class="hidden">
        <form id="newsForm" class="form-grid">
          <input id="itemId" type="hidden">
          <label class="field"><span>Kategori</span><select id="category" required></select></label>
          <label class="field"><span>Haber başlığı</span><input id="title" maxlength="240" placeholder="Haber başlığını yazın"></label>
          <label class="field wide"><span>Haber bağlantısı</span><input id="link" type="url" placeholder="https://kaynak.com/haber" required></label>
          <div class="wide form-actions"><button id="cancelEdit" type="button" class="button ghost hidden">Düzenlemeyi iptal et</button><button id="saveNews" class="button light" type="submit">Haberi ekle</button></div>
        </form>
        <section class="category-manager" aria-labelledby="categoryHeading">
          <div class="category-manager-head"><div><h3 id="categoryHeading">Kategorileri yönet</h3><p>Kategori ekleyebilir, adını değiştirebilir veya kaldırabilirsiniz.</p></div></div>
          <form id="categoryForm" class="category-form"><label class="visually-hidden" for="newCategory">Yeni kategori adı</label><input id="newCategory" maxlength="60" placeholder="Yeni kategori adı" required><button class="button light" type="submit">Kategori ekle</button></form>
          <div id="categoryList" class="category-list"></div>
        </section>
        <div class="admin-list-head"><h3>Eklenen haberler</h3><span id="adminCount"></span></div>
      </div>
      <p id="errorMessage" class="error hidden" role="alert"></p>
    </section>
    <section class="feed-head"><div class="eyebrow">SON HABERLER</div><h2 id="feedTitle" class="visually-hidden" aria-live="polite">Haberler yükleniyor…</h2></section>
    <section id="feed" class="feed" aria-live="polite"></section>
    <div id="empty" class="empty hidden">Bu kategoride henüz haber yok.</div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script src="app.js"></script>
</body>
</html>
