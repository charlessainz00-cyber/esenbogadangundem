<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kargiligundem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <main class="layout">
      <section class="panel form-panel">
        <form id="admin-form" class="news-form compact-form">
          <input
            id="admin-key"
            name="adminKey"
            type="password"
            placeholder="Yonetici anahtari"
          >

          <div class="form-actions">
            <button type="submit" class="primary-btn" id="admin-submit-btn">Giris Yap</button>
            <button type="button" class="ghost-btn hidden" id="logout-btn">Cikis</button>
          </div>
        </form>

        <div id="category-manager" class="category-manager hidden">
          <div class="mini-row">
            <button type="button" class="ghost-btn slim-btn" id="add-category-btn">Kategori Ekle</button>
          </div>
          <div id="category-admin-list" class="category-admin-list"></div>
        </div>

        <form id="news-form" class="news-form hidden">
          <input type="hidden" id="editing-id">

          <label for="news-category">Kategori</label>
          <select id="news-category" name="category"></select>

          <label for="news-title">Baslik</label>
          <input
            id="news-title"
            name="title"
            type="text"
            placeholder="Orn. Gundemde one cikan gelisme"
            required
          >

          <label for="news-link">X Linki</label>
          <input
            id="news-link"
            name="link"
            type="url"
            placeholder="https://x.com/... veya https://twitter.com/..."
            required
          >

          <div class="form-actions">
            <button type="submit" class="primary-btn" id="submit-btn">Haberi Ekle</button>
            <button type="button" class="ghost-btn hidden" id="cancel-edit-btn">Iptal</button>
          </div>
        </form>

        <p id="admin-status" class="admin-status hidden"></p>
      </section>

      <section class="panel list-panel">
        <div id="category-filters" class="category-filters"></div>
        <div id="news-list" class="news-list"></div>
      </section>
    </main>
  </div>

  <template id="empty-state-template">
    <div class="empty-state">
      <p>Bu alanda gosterilecek haber bulunmuyor.</p>
    </div>
  </template>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script src="script.js"></script>
</body>
</html>
